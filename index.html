<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TJA Client Portal — Sign In</title>
<link rel="icon" href="assets/img/favicon.ico?v=347" sizes="16x16">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png?v=347">
<script>(function(){try{if(localStorage.getItem('tja_theme')!=='dark')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=347">
<!-- BugHerd — in-page bug reporting for testers (added 2026-07-24) -->
<script type="text/javascript" src="https://www.bugherd.com/sidebarv2.js?apikey=zdauiuhvwwlqfns37stqlg" async="true"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand-lockup">
      <div class="brand-logo">
        <svg viewBox="0 0 474 218" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The James Agency"><rect width="474" height="218" rx="6" fill="#F68E21"/><text x="237" y="158" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="170" letter-spacing="-6">tja</text></svg>
        <img src="assets/img/tja-logo.svg" alt="The James Agency" onerror="this.remove()">
      </div>
      <div class="brand-sub">Client Portal</div>
    </div>

    <div class="login-title">Sign in</div>
    <div class="login-hint">Enter the credentials provided by your account team.</div>

    <div class="login-error" id="loginError">Incorrect email or password. Please try again.</div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@company.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <div class="login-forgot"><a href="#" id="forgotLink">Forgot your password?</a></div>
    <div class="login-note" id="loginNote"></div>

    <div class="login-foot">
      © 2026 The James Agency · v3.07
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js?v=347"></script>
<script src="assets/js/version-check.js?v=347"></script>
<script src="assets/js/supabase-sync.js?v=347"></script>
<script src="assets/js/auth.js?v=347"></script>
<!-- client roster on the login page so per-client logins resolve to their own workspace -->
<script src="assets/js/clients.js?v=347"></script>
<script src="assets/js/client-template.js?v=347"></script>
<script src="assets/js/client-store.js?v=347"></script>
<script>
  // Deep-link from the deliverable email (?open=docs&doc=<id>): stash the target page
  // (and optional specific deliverable) so app.js opens it after login. Same keys the
  // notification-center deep-link uses — the client lands straight on the deliverable
  // whether they're already signed in or have to log in first.
  try {
    const qp = new URLSearchParams(location.search);
    const openTo = qp.get("open");
    if (openTo) sessionStorage.setItem("tja_open_page", openTo);
    const openDoc = qp.get("doc");
    if (openDoc) sessionStorage.setItem("tja_open_doc", openDoc);
    // WHICH client the deliverable belongs to. Slack/email links are followed by STAFF, whose
    // session isn't pinned to a client — without this they landed on the picker and the link was
    // lost (only dashboard.html consumes tja_open_page/doc). See landing() below.
    const openClient = qp.get("client");
    if (openClient) sessionStorage.setItem("tja_open_client", openClient);
  } catch (e) {}

  /* Where to send someone after sign-in. Normally: staff → the client picker, client → their own
     workspace. EXCEPTION — a deep link that names a client (?client=…): a STAFF viewer goes
     straight to that client's dashboard so the deliverable actually opens. Gated on isStaff():
     a client login must never be able to switch workspace from a URL (RLS would refuse the reads
     anyway, but don't even try). */
  const landing = () => {
    const staff = (typeof isStaff === "function") && isStaff();
    try {
      const want = sessionStorage.getItem("tja_open_client");
      if (want && staff) {
        const s = JSON.parse(sessionStorage.getItem("tja_portal_session") || "{}");
        s.client = want;
        sessionStorage.setItem("tja_portal_session", JSON.stringify(s));
        sessionStorage.removeItem("tja_open_client");
        return "dashboard.html";
      }
      if (want && !staff) sessionStorage.removeItem("tja_open_client");
    } catch (e) {}
    return staff ? "clients.html" : "dashboard.html";
  };

  // If already signed in, skip the login form. restoreSession() also rebuilds the
  // per-tab session from a persisted Supabase login (new tab ≠ re-type password).
  // EXCEPT on a session-guard landing (?auth=…): auto-restoring would instantly morph this
  // tab into whichever account owns the browser now and hide the explanation — the person
  // should read why they landed here and sign in deliberately.
  if (!new URLSearchParams(location.search).get("auth")) {
    if (getSession()) window.location.replace(landing());
    else restoreSession().then(ok => { if (ok) window.location.replace(landing()); });
  }

  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true;
    const okLogin = await login(email, password);     // Supabase when configured, mock otherwise
    btn.disabled = false;
    if (okLogin) window.location.replace(landing());
    else document.getElementById("loginError").classList.add("show");
  });

  /* Session-guard landings: the keepalive heartbeat (supabase-sync.js) bounces a tab here the
     moment its auth session dies or is taken over by a different login in this browser —
     explain WHY instead of presenting a bare login form. */
  (function () {
    const why = new URLSearchParams(location.search).get("auth");
    if (!why) return;
    const note = document.getElementById("loginNote");
    note.className = "login-note warn show";
    note.textContent = why === "switched"
      ? "You signed into a different account in another tab — a browser can only hold one login at a time, so this tab was signed out. Use a separate browser profile (or a private window) to run two logins side-by-side."
      : "Your session expired, so you were signed out to keep things from failing silently. Sign back in to continue.";
  })();

  /* Forgot password — emails a reset link to the account's OWN address (always, regardless
     of their notification preference; recovery isn't a notification). We show the same
     confirmation whether or not the email has an account, so nothing can be enumerated. */
  document.getElementById("forgotLink").addEventListener("click", async function (e) {
    e.preventDefault();
    const emailEl = document.getElementById("email");
    const note = document.getElementById("loginNote");
    const email = (emailEl.value || "").trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      note.className = "login-note warn show";
      note.textContent = "Enter your email above first, then tap “Forgot your password?”";
      emailEl.focus();
      return;
    }
    const cfg = window.SUPABASE_CONFIG || {};
    const base = cfg.url ? cfg.url.replace(/\/$/, "") + "/functions/v1" : "";
    this.style.pointerEvents = "none";
    try {
      if (base) await fetch(base + "/request-password-reset", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: cfg.anonKey || "", Authorization: "Bearer " + (cfg.anonKey || "") },
        body: JSON.stringify({ email }),
      });
    } catch (err) { /* show the same confirmation regardless */ }
    this.style.pointerEvents = "";
    note.className = "login-note ok show";
    note.textContent = "If an account exists for " + email + ", a reset link is on its way. Check your inbox (and spam).";
  });
</script>
</body>
</html>
