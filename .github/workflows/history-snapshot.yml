name: History snapshot + archive

# Daily: writes one gzipped snapshot per changed client to the Drive history folder, and
# archives audit_log rows older than 45 days to Drive before pruning them from Supabase.
# Inert until DRIVE_HISTORY_FOLDER_ID is set (returns 428, harmless).

on:
  schedule:
    - cron: "0 9 * * *"      # 09:00 UTC = 02:00 America/Phoenix (quiet hours)
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger history-snapshot
        env:
          SNAPSHOT_SECRET: ${{ secrets.SNAPSHOT_SECRET }}
          ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsaXV0a2JkcHVpbXh4bXZzYmVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4OTg3OTEsImV4cCI6MjA5NzQ3NDc5MX0.Pa4UtmxtfB4siweG4RYaY7r4Z7rAmP4yjAm52RvrzEE"
        run: |
          curl -sS -X POST "https://sliutkbdpuimxxmvsbek.supabase.co/functions/v1/history-snapshot" \
            -H "x-snapshot-secret: ${SNAPSHOT_SECRET}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -w "\nHTTP %{http_code}\n"
