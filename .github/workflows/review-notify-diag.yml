name: Present Docs review-notification check (read-only)

# Manual, READ-ONLY diagnostic: for one client, lists recent review rounds and whether the
# team notification went out (Slack/email state, retry count, error code). This repo is
# PUBLIC, so the function returns only ids, counts and states — no names, emails or notes.

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Client id or name (substring, e.g. srp)"
        required: true
      days:
        description: "Look back this many days"
        required: false
        default: "14"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check review notifications
        env:
          SNAPSHOT_SECRET: ${{ secrets.SNAPSHOT_SECRET }}
          ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsaXV0a2JkcHVpbXh4bXZzYmVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4OTg3OTEsImV4cCI6MjA5NzQ3NDc5MX0.Pa4UtmxtfB4siweG4RYaY7r4Z7rAmP4yjAm52RvrzEE"
          CLIENT: ${{ inputs.client }}
          DAYS: ${{ inputs.days }}
        run: |
          body=$(jq -nc --arg c "$CLIENT" --arg d "$DAYS" '{mode:"diag", client:$c, days:($d|tonumber)}')
          curl -sS --fail-with-body -X POST "https://sliutkbdpuimxxmvsbek.supabase.co/functions/v1/send-review-notification" \
            -H "x-snapshot-secret: ${SNAPSHOT_SECRET}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "$body" | jq .
