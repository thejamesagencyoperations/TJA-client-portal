name: Audit digest email (temporary)

# TEMPORARY — commissioned to cover Cameron's absence, 3–17 August 2026, and NOT wanted
# ongoing. The expiry lives in the FUNCTION (DIGEST_UNTIL in supabase/functions/audit-digest):
# past that date it sends nothing and returns {expired:true}, so the emails stop by themselves
# even if this workflow is left in place. Deleting this file after 17 Aug 2026 is tidy-up, not
# a requirement — the last email in the window says as much.

# SCHEDULE INTENTIONALLY DISABLED (Cameron 2026-08-03). He wants emails about PUSHES TO MAIN,
# not portal data edits — see .github/workflows/push-digest.yml for the one that's live.
# The function stays deployed and this stays runnable ON DEMAND because the per-client grouping
# here is the foundation for a planned client-activity tracker (spotting accounts whose
# deadlines keep slipping). Re-enable by uncommenting the cron.
on:
  # schedule:
  #   - cron: "0 14 * * *"    # 07:00 America/Phoenix
  workflow_dispatch:          # send one on demand from the Actions tab
    inputs:
      inspect:
        description: "Report the actor breakdown instead of sending an email"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send the audit digest
        env:
          SNAPSHOT_SECRET: ${{ secrets.SNAPSHOT_SECRET }}
          ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsaXV0a2JkcHVpbXh4bXZzYmVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4OTg3OTEsImV4cCI6MjA5NzQ3NDc5MX0.Pa4UtmxtfB4siweG4RYaY7r4Z7rAmP4yjAm52RvrzEE"
        run: |
          Q=""; [ "${{ inputs.inspect }}" = "true" ] && Q="?inspect=1"
          curl -sS -X POST "https://sliutkbdpuimxxmvsbek.supabase.co/functions/v1/audit-digest${Q}" \
            -H "x-snapshot-secret: ${SNAPSHOT_SECRET}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -w "\nHTTP %{http_code}\n" --fail-with-body
