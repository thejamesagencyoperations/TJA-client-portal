name: Push digest email (temporary)

# Daily email of what was PUSHED TO MAIN — i.e. what was released to the live portal,
# since main deploys to Pages with no review gate. Portal DATA edits are a separate thing
# (audit-digest, currently schedule-disabled).
#
# TEMPORARY — commissioned for Cameron's absence, 3–17 August 2026. The expiry lives in the
# FUNCTION (DIGEST_UNTIL in supabase/functions/push-digest): past that date it sends nothing,
# so the emails stop by themselves even if this file is left in place. The last in-window
# email says so. Deleting this afterwards is tidy-up, not a requirement.

on:
  schedule:
    # 14:10 UTC = 07:10 America/Phoenix. Ten minutes after the other morning jobs so the two
    # digests don't arrive in the same second. The window is a rolling 24h rather than a
    # calendar day, so GitHub's scheduling delays can't drop or double-count a push.
    - cron: "10 14 * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Shallow clones have no history to walk. 200 commits comfortably covers a day even
          # on a heavy one, without cloning the whole repo.
          fetch-depth: 200

      - name: Collect commits from the window
        id: collect
        env:
          WINDOW_HOURS: "24"
        run: |
          set -euo pipefail
          SINCE="${WINDOW_HOURS} hours ago"
          # Unit separator (\x1f) between fields and record separator (\x1e) between commits:
          # commit subjects contain commas, quotes and newlines, so anything friendlier breaks.
          RAW=$(git log --since="$SINCE" --no-merges \
                  --pretty=format:'%H%x1f%an%x1f%ae%x1f%aI%x1f%s%x1e' || true)

          # Per-commit shortstat, keyed by sha, so the email can show files/lines touched.
          echo "[]" > /tmp/commits.json
          if [ -n "$RAW" ]; then
            printf '%s' "$RAW" | python3 -c '
import json, subprocess, sys
raw = sys.stdin.read()
out = []
for rec in [r for r in raw.split("\x1e") if r.strip()]:
    parts = rec.strip("\n").split("\x1f")
    if len(parts) < 5: continue
    sha, an, ae, ai, subj = parts[0], parts[1], parts[2], parts[3], parts[4]
    files = ins = dels = 0
    try:
        st = subprocess.run(["git","log","-1","--shortstat","--format=",sha],
                            capture_output=True, text=True, timeout=20).stdout
        import re
        m = re.search(r"(\d+) files? changed", st);      files = int(m.group(1)) if m else 0
        m = re.search(r"(\d+) insertions?\(\+\)", st);   ins   = int(m.group(1)) if m else 0
        m = re.search(r"(\d+) deletions?\(-\)", st);     dels  = int(m.group(1)) if m else 0
    except Exception:
        pass
    out.append({"sha":sha,"author":an,"email":ae,"date":ai,"subject":subj,
                "files":files,"insertions":ins,"deletions":dels})
json.dump(out, open("/tmp/commits.json","w"))
print(f"collected {len(out)} commit(s)", file=sys.stderr)
'
          fi
          python3 -c '
import json
c = json.load(open("/tmp/commits.json"))
json.dump({"commits": c, "windowHours": 24, "branch": "main"}, open("/tmp/payload.json","w"))
print("commits:", len(c))
'

      - name: Send the push digest
        env:
          SNAPSHOT_SECRET: ${{ secrets.SNAPSHOT_SECRET }}
          ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsaXV0a2JkcHVpbXh4bXZzYmVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4OTg3OTEsImV4cCI6MjA5NzQ3NDc5MX0.Pa4UtmxtfB4siweG4RYaY7r4Z7rAmP4yjAm52RvrzEE"
        run: |
          curl -sS -X POST "https://sliutkbdpuimxxmvsbek.supabase.co/functions/v1/push-digest" \
            -H "x-snapshot-secret: ${SNAPSHOT_SECRET}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "Content-Type: application/json" \
            --data @/tmp/payload.json \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -w "\nHTTP %{http_code}\n" --fail-with-body
