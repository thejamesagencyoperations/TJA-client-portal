name: Push digest email (temporary)

# Daily email of what was PUSHED TO MAIN — i.e. what was released to the live portal,
# since main deploys to Pages with no review gate. Portal DATA edits are a separate
# thing (audit-digest, whose schedule is currently disabled).
#
# TEMPORARY — commissioned for Cameron's absence, 3–17 August 2026. The expiry lives in
# the FUNCTION (DIGEST_UNTIL in supabase/functions/push-digest): past that date it sends
# nothing, so the emails stop by themselves even if this file is left in place. The last
# in-window email says so. Deleting this afterwards is tidy-up, not a requirement.

on:
  schedule:
    # 14:10 UTC = 07:10 America/Phoenix. Ten minutes after the other morning jobs so two
    # emails don't land in the same second. The window is a rolling 24h rather than a
    # calendar day, so GitHub's scheduling delays can't drop or double-count a push.
    - cron: "10 14 * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Shallow clones have no history to walk. 200 commits comfortably covers a day
          # even a heavy one, without cloning the whole repo.
          fetch-depth: 200

      # The git work lives in scripts/collect-commits.py, NOT inline here: Python needs
      # unindented top-level code and YAML's block scalar needs it indented, which cannot
      # both hold. Inlining it broke this workflow's parsing outright.
      - name: Collect commits from the window
        run: python3 scripts/collect-commits.py 24 main > /tmp/payload.json

      - name: Send the push digest
        env:
          SNAPSHOT_SECRET: ${{ secrets.SNAPSHOT_SECRET }}
          ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsaXV0a2JkcHVpbXh4bXZzYmVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4OTg3OTEsImV4cCI6MjA5NzQ3NDc5MX0.Pa4UtmxtfB4siweG4RYaY7r4Z7rAmP4yjAm52RvrzEE"
        run: |
          curl -sS -X POST "https://sliutkbdpuimxxmvsbek.supabase.co/functions/v1/push-digest" \
            -H "x-snapshot-secret: ${SNAPSHOT_SECRET}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "Content-Type: application/json" \
            --data @/tmp/payload.json \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -w "\nHTTP %{http_code}\n" --fail-with-body
