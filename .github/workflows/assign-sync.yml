name: AM/PM assignment sync

# Reads the client-assignment workbook (most recent month tab) and sets each client's
# Account Manager + Project Manager. Runs daily so mid-month changes flow in; the function
# only writes a client when the assignment actually changed, and NEVER overwrites a client an
# admin set by hand (integrations.amPmManual) or one whose names failed to resolve.

on:
  schedule:
    - cron: "30 16 * * *"    # 16:30 UTC daily
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger assign-sync
        env:
          SNAPSHOT_SECRET: ${{ secrets.SNAPSHOT_SECRET }}
          ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsaXV0a2JkcHVpbXh4bXZzYmVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4OTg3OTEsImV4cCI6MjA5NzQ3NDc5MX0.Pa4UtmxtfB4siweG4RYaY7r4Z7rAmP4yjAm52RvrzEE"
        run: |
          curl -sS -X POST "https://sliutkbdpuimxxmvsbek.supabase.co/functions/v1/assign-sync" \
            -H "x-snapshot-secret: ${SNAPSHOT_SECRET}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -w "\nHTTP %{http_code}\n"
