name: AM/PM assignment sync

# Reads the client-assignment workbook (most recent month tab) and sets each client's
# Account Manager + Project Manager. Runs daily so mid-month changes flow in; the function
# only writes a client when the assignment actually changed, and NEVER overwrites a client an
# admin set by hand (integrations.amPmManual) or one whose names failed to resolve.

on:
  schedule:
    - cron: "30 16 * * *"    # 16:30 UTC daily
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run (report only, write nothing)"
        type: boolean
        default: false
      op:
        description: "Optional: pin or unpin a manager instead of syncing"
        type: choice
        options: ["sync", "pin", "unpin", "merge"]
        default: "sync"
      client:
        description: "pin/unpin: client id (e.g. salt-river-project)"
        required: false
      name:
        description: "pin/unpin: full name (e.g. Alex Duggan)"
        required: false
      from:
        description: "merge: the DUPLICATE client id to fold into 'client' (e.g. blaze-adventure-park)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger assign-sync
        env:
          SNAPSHOT_SECRET: ${{ secrets.SNAPSHOT_SECRET }}
          OP: ${{ inputs.op }}
          CLIENT: ${{ inputs.client }}
          NAME: ${{ inputs.name }}
          FROM: ${{ inputs.from }}
          DRYQ: ${{ inputs.dry && '?dry=1' || '' }}
          ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsaXV0a2JkcHVpbXh4bXZzYmVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4OTg3OTEsImV4cCI6MjA5NzQ3NDc5MX0.Pa4UtmxtfB4siweG4RYaY7r4Z7rAmP4yjAm52RvrzEE"
        run: |
          if [ "$OP" = "merge" ]; then
            Q="?op=merge&client=$(jq -rn --arg v "$CLIENT" '$v|@uri')&from=$(jq -rn --arg v "$FROM" '$v|@uri')"
          elif [ "$OP" = "pin" ] || [ "$OP" = "unpin" ]; then
            Q="?op=${OP}&client=$(jq -rn --arg v "$CLIENT" '$v|@uri')&name=$(jq -rn --arg v "$NAME" '$v|@uri')"
          else
            Q="${DRYQ}"
          fi
          curl -sS --fail-with-body -X POST "https://sliutkbdpuimxxmvsbek.supabase.co/functions/v1/assign-sync${Q}" \
            -H "x-snapshot-secret: ${SNAPSHOT_SECRET}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -w "\nHTTP %{http_code}\n"
