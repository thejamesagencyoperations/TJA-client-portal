<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Health · TJA Portal</title>
<link rel="icon" href="assets/img/favicon.ico?v=376" sizes="16x16">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png?v=376">
<script>(function(){try{if(localStorage.getItem('tja_theme')!=='dark')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=376">
<!-- BugHerd — in-page bug reporting for testers (added 2026-07-24) -->
<script type="text/javascript" src="https://www.bugherd.com/sidebarv2.js?apikey=zdauiuhvwwlqfns37stqlg" async="true"></script>
</head>
<body data-role="admin">
<div class="clients-page">
  <header class="topbar">
    <div class="client-id">
      <div class="brand-logo brand-logo--sm">
        <svg viewBox="0 0 474 218" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The James Agency"><rect width="474" height="218" rx="6" fill="#F68E21"/><text x="237" y="158" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="170" letter-spacing="-6">tja</text></svg>
        <img src="assets/img/tja-logo.svg" alt="The James Agency" onerror="this.remove()">
      </div>
      <div class="client-id-text"><div class="client-line"><span class="client-name">System Health</span></div></div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="themeToggle" title="Light / dark mode" aria-label="Toggle theme"></button>
    </div>
  </header>

  <main class="content">
    <div class="page-head">
      <div class="page-title">System health</div>
      <div class="page-desc">Whether the portal's automation is actually running, and whether any client's
        data has gone stale. Read-only — fixes happen on the client's own page or in Admin Center.</div>
    </div>

    <div class="hz-bar">
      <div class="hz-summary" id="hzSummary"></div>
      <div class="hz-bar-right">
        <span class="hz-stamp" id="hzStamp"></span>
        <button class="btn btn-ghost btn-sm" id="hzRefresh">Re-check</button>
      </div>
    </div>

    <div class="hz-section-title">Scheduled jobs</div>
    <div class="hz-jobs" id="hzJobs"></div>

    <div class="hz-section-title">Findings</div>
    <div id="hzFindings"><div class="hz-empty">Running checks…</div></div>
    <div style="height:40px"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js?v=376"></script>
<script src="assets/js/version-check.js?v=376"></script>
<script src="assets/js/supabase-sync.js?v=376"></script>
<script src="assets/js/ui.js?v=376"></script>
<script src="assets/js/auth.js?v=376"></script>
<script src="assets/js/chrome-menu.js?v=376"></script>
<script>
  requireAuth();
  /* Admin only. The checks read EVERY client's dashboard row, which RLS grants to admins
     alone — a manager would get a partial, misleading picture, so send them away rather
     than render half a health report. */
  (function () {
    const ok = (typeof isAdmin === "function") && isAdmin();
    if (!ok) window.location.replace(typeof isStaff === "function" && isStaff() ? "clients.html" : "dashboard.html");
  })();
</script>
<script src="assets/js/clients.js?v=376"></script>
<script src="assets/js/client-template.js?v=376"></script>
<script src="assets/js/client-store.js?v=376"></script>
<script src="assets/js/health.js?v=376"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const applyTheme = (t) => document.documentElement.setAttribute("data-theme", t);
  const curTheme = () => (localStorage.getItem("tja_theme") === "dark" ? "dark" : "light");
  applyTheme(curTheme());
  $("themeToggle").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
  $("themeToggle").addEventListener("click", () => { const n = curTheme() === "dark" ? "light" : "dark"; localStorage.setItem("tja_theme", n); applyTheme(n); });

  // Hydrate the roster + workspace settings first: the checks read both (client names, and
  // the "restrict AM/PM editing" rule that decides whether an unassigned client is an access
  // failure or just untidy). Without this the page would judge against a stale cache.
  const boot = async () => {
    if (window.TJA_STORE && window.TJA_STORE.hydrate) { try { await window.TJA_STORE.hydrate(); } catch (e) {} }
    window.TJA_HEALTH.run();
  };
  $("hzRefresh").addEventListener("click", boot);
  boot();
})();
</script>
</body>
</html>
