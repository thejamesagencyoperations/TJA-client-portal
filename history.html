<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History · TJA Portal</title>
<link rel="icon" href="assets/img/favicon.ico?v=330" sizes="16x16">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png?v=330">
<script>(function(){try{if(localStorage.getItem('tja_theme')!=='dark')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=330">
<!-- BugHerd — in-page bug reporting for testers (added 2026-07-24) -->
<script type="text/javascript" src="https://www.bugherd.com/sidebarv2.js?apikey=zdauiuhvwwlqfns37stqlg" async="true"></script>
</head>
<body data-role="admin">
<div class="clients-page">
  <header class="topbar">
    <div class="client-id">
      <div class="brand-logo brand-logo--sm">
        <svg viewBox="0 0 474 218" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The James Agency"><rect width="474" height="218" rx="6" fill="#F68E21"/><text x="237" y="158" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="170" letter-spacing="-6">tja</text></svg>
        <img src="assets/img/tja-logo.svg" alt="The James Agency" onerror="this.remove()">
      </div>
      <div class="client-id-text"><div class="client-line"><span class="client-name">History</span></div></div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="themeToggle" title="Light / dark mode" aria-label="Toggle theme"></button>
    </div>
  </header>

  <main class="content">
    <div class="page-head">
      <div class="page-title">Edit history</div>
      <div class="page-desc">Who changed what, and when. The last 45 days are shown here; older history is archived to Drive.</div>
    </div>

    <div class="tm-note" id="hNote" style="display:none"></div>

    <div class="tm-filter-row">
      <div class="tm-chips" id="hTypeChips">
        <button class="tm-chip active" data-htype="">Everything</button>
        <button class="tm-chip" data-htype="edit">Edits</button>
        <button class="tm-chip" data-htype="deliverable">Present Docs</button>
        <button class="tm-chip" data-htype="login">Logins</button>
        <button class="tm-chip" data-htype="sync">Syncs</button>
      </div>
      <div class="tm-filter-right">
        <select class="tm-client-filter" id="hClient"><option value="">All clients</option></select>
        <input type="search" class="tm-search" id="hSearch" placeholder="Search person, client or change…">
      </div>
    </div>

    <div id="hFeed" class="hist-feed"><div class="pr-date" style="padding:18px 4px">Loading history…</div></div>
    <div style="text-align:center;margin:18px 0 40px">
      <button class="btn btn-ghost btn-sm" id="hMore" style="display:none">Load more</button>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js?v=330"></script>
<script src="assets/js/version-check.js?v=330"></script>
<script src="assets/js/supabase-sync.js?v=330"></script>
<script src="assets/js/ui.js?v=330"></script>
<script src="assets/js/auth.js?v=330"></script>
<script src="assets/js/chrome-menu.js?v=330"></script>
<script>
  requireAuth();
  // Staff who manage clients only. RLS enforces this server-side too (audit_log SELECT is
  // admin+manager); this just avoids serving a page that would come back empty.
  (function () {
    const ok = (typeof isAdmin === "function" && isAdmin()) || (typeof isManager === "function" && isManager());
    if (!ok) window.location.replace(typeof isStaff === "function" && isStaff() ? "clients.html" : "dashboard.html");
  })();
</script>
<script src="assets/js/clients.js?v=330"></script>
<script src="assets/js/client-template.js?v=330"></script>
<script src="assets/js/client-store.js?v=330"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  const applyTheme = (t) => document.documentElement.setAttribute("data-theme", t);
  const curTheme = () => (localStorage.getItem("tja_theme") === "dark" ? "dark" : "light");
  applyTheme(curTheme());
  $("themeToggle").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
  $("themeToggle").addEventListener("click", () => { const n = curTheme() === "dark" ? "light" : "dark"; localStorage.setItem("tja_theme", n); applyTheme(n); });

  const AMPM = !((typeof isAdmin === "function") && isAdmin());   // manager → their clients only
  const myName = (() => { try { return String((getSession() || {}).name || "").trim().toLowerCase(); } catch (e) { return ""; } })();

  let rows = [], typeFilter = "", clientFilter = "", search = "", oldest = null, exhausted = false;

  await window.TJA_STORE.hydrate().catch(() => {});
  // A manager only sees clients they're assigned to (same rule as edit access).
  const mine = (c) => !AMPM || [c.am, c.pm, ...(Array.isArray(c.managers) ? c.managers : [])]
    .some(m => String(m || "").trim().toLowerCase() === myName);
  const roster = (window.TJA_STORE.list() || []).filter(c => !String(c.id).startsWith("_"));
  const visible = roster.filter(mine);
  const allowed = new Set(visible.map(c => c.id).concat(["_registry"]));
  const nameOf = (id) => {
    if (id === "_registry") return "All clients / roster";
    const c = roster.find(x => x.id === id);
    return c ? c.name : id;
  };
  $("hClient").innerHTML = `<option value="">All clients</option>` +
    visible.slice().sort((a, b) => a.name.localeCompare(b.name)).map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");

  // deep-link: history.html?client=<id>
  try {
    const qp = new URLSearchParams(location.search).get("client");
    if (qp && allowed.has(qp)) { clientFilter = qp; $("hClient").value = qp; }
  } catch (e) {}

  const when = (iso) => {
    const d = new Date(iso), diff = (Date.now() - d) / 1000;
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff / 60) + "m ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  };
  const dayLabel = (iso) => {
    const d = new Date(iso), t = new Date(), y = new Date(Date.now() - 86400000);
    const same = (a, b) => a.toDateString() === b.toDateString();
    if (same(d, t)) return "Today";
    if (same(d, y)) return "Yesterday";
    return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
  };
  // group the flat action strings into the chip buckets
  const bucket = (a) => {
    const s = String(a || "");
    if (s.startsWith("deliverable")) return "deliverable";
    if (s.startsWith("login")) return "login";
    if (s.includes("sync") || s.startsWith("plan.") || s.startsWith("assignments")) return "sync";
    return "edit";
  };
  const ICON = { edit: "✎", deliverable: "📄", login: "👤", sync: "↻" };

  function matches(r) {
    if (!allowed.has(r.client_id)) return false;              // manager scoping
    if (typeFilter && bucket(r.action) !== typeFilter) return false;
    if (clientFilter && r.client_id !== clientFilter) return false;
    if (!search) return true;
    const hay = [r.actor_name, r.actor_email, nameOf(r.client_id), r.summary,
      ...(Array.isArray(r.changes) ? r.changes.map(c => c.p + " " + c.f + " " + c.t) : [])].join(" ").toLowerCase();
    return hay.indexOf(search) > -1;
  }

  function render() {
    const list = rows.filter(matches);
    const feed = $("hFeed");
    if (!list.length) {
      feed.innerHTML = `<div class="pr-date" style="padding:18px 4px">No history matches that filter yet.</div>`;
      return;
    }
    let html = "", lastDay = "";
    list.forEach((r, i) => {
      const day = dayLabel(r.ts);
      if (day !== lastDay) { html += `<div class="hist-day">${esc(day)}</div>`; lastDay = day; }
      const b = bucket(r.action);
      const who = r.actor_name || r.actor_email || "TJA Portal";
      const changes = Array.isArray(r.changes) ? r.changes : [];
      const detail = changes.length
        ? `<div class="hist-detail" id="hd${i}" style="display:none">` +
          changes.map(c => `<div class="hist-change"><span class="hc-path">${esc(c.p)}</span>` +
            `<span class="hc-from">${esc(c.f || "empty")}</span><span class="hc-arrow">→</span><span class="hc-to">${esc(c.t || "empty")}</span></div>`).join("") +
          (r.n > changes.length ? `<div class="hist-more-note">…and ${r.n - changes.length} more change${r.n - changes.length === 1 ? "" : "s"}</div>` : "") +
          `</div>` : "";
      html += `<div class="hist-row ${b}">
        <div class="hist-ico">${ICON[b] || "•"}</div>
        <div class="hist-body">
          <div class="hist-line"><b>${esc(who)}</b> ${esc(r.summary || r.action)}</div>
          <div class="hist-meta">${esc(nameOf(r.client_id))} · ${esc(when(r.ts))}${changes.length ? ` · <button class="hist-toggle" data-toggle="hd${i}">details</button>` : ""}</div>
          ${detail}
        </div>
      </div>`;
    });
    feed.innerHTML = html;
  }

  $("hFeed").addEventListener("click", (e) => {
    const t = e.target.closest("[data-toggle]"); if (!t) return;
    const el = document.getElementById(t.dataset.toggle); if (!el) return;
    const open = el.style.display !== "none";
    el.style.display = open ? "none" : "";
    t.textContent = open ? "details" : "hide";
  });

  async function load(more) {
    if (!(window.SUPA && window.SUPA.enabled && window.SUPA.readAudit)) {
      $("hNote").className = "tm-note warn"; $("hNote").style.display = "";
      $("hNote").innerHTML = "<b>History needs the live backend.</b> Sign in with your real password (not the demo one).";
      $("hFeed").innerHTML = "";
      return;
    }
    const batch = await window.SUPA.readAudit({ before: more ? oldest : null, limit: 200 });
    if (!batch.length && !more && !rows.length) {
      $("hFeed").innerHTML = `<div class="pr-date" style="padding:18px 4px">No history recorded yet. Once the audit table is set up, every edit shows here.</div>`;
      $("hMore").style.display = "none";
      return;
    }
    rows = more ? rows.concat(batch) : batch;
    if (batch.length) oldest = batch[batch.length - 1].ts;
    exhausted = batch.length < 200;
    $("hMore").style.display = exhausted ? "none" : "";
    render();
  }

  $("hTypeChips").addEventListener("click", (e) => {
    const chip = e.target.closest(".tm-chip"); if (!chip) return;
    typeFilter = chip.dataset.htype;
    [...$("hTypeChips").querySelectorAll(".tm-chip")].forEach(c => c.classList.toggle("active", c === chip));
    render();
  });
  $("hClient").addEventListener("change", (e) => { clientFilter = e.target.value; render(); });
  $("hSearch").addEventListener("input", (e) => { search = e.target.value.trim().toLowerCase(); render(); });
  $("hMore").addEventListener("click", () => load(true));

  await load(false);
  // stay current without a manual refresh, like the other staff pages
  window.addEventListener("focus", () => load(false));
  setInterval(() => { if (!document.hidden) load(false); }, 60000);
})();
</script>
</body>
</html>
